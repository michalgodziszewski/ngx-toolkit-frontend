<table mat-table [dataSource]="documents()" class="mat-elevation-z8">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nazwa</th>
    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="documentType">
    <th mat-header-cell *matHeaderCellDef>Typ</th>
    <td mat-cell *matCellDef="let element">{{ element.documentType }}</td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="packageType">
    <th mat-header-cell *matHeaderCellDef>Pakiet</th>
    <td mat-cell *matCellDef="let element">{{ element.packageType }}</td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>Akcje</th>
    <td mat-cell *matCellDef="let element">
      <button (click)="downloadDocument(element.id, element.name)">
        Pobierz
      </button>
      <button (click)="removeDocument(element.id)">Usuń</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
